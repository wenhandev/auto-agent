name: Build client

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "client/**"
      - "frontend/src/client/**"
      - "frontend/src/pages/RecordingsListPage.tsx"
      - "frontend/src/pages/RecordingDetailPage.tsx"
      - "frontend/src/pages/AutonomousTaskPage.tsx"
      - "frontend/src/pages/RunReplayPage.tsx"
      - "backend/app/worker/**"
      - "worker/**"
      - ".github/workflows/build-client.yml"

env:
  VITE_CLOUD_URL: https://rpa.wenhandev.com
  VITE_CLIENT_RELEASES_URL: https://github.com/wenhandev/auto-agent/releases

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: auto-agent-client-macos
          - os: windows-latest
            artifact: auto-agent-client-windows
          - os: ubuntu-latest
            artifact: auto-agent-client-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Build sidecar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\worker\build-exe.ps1
          python -m playwright install chromium

      - name: Build sidecar (macOS)
        if: runner.os == 'macOS'
        run: |
          ./worker/build-macos.sh
          python -m playwright install chromium

      - name: Build sidecar (Linux)
        if: runner.os == 'Linux'
        run: |
          ./worker/build-linux.sh
          python -m playwright install chromium

      - name: Stage sidecar for Tauri (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\worker\stage-client-sidecar.ps1

      - name: Stage sidecar for Tauri (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          chmod +x ./worker/stage-client-sidecar.sh
          ./worker/stage-client-sidecar.sh

      - name: Install client npm deps
        working-directory: client
        run: npm ci

      - name: Build client frontend
        working-directory: client
        env:
          VITE_CLOUD_URL: ${{ env.VITE_CLOUD_URL }}
          VITE_CLIENT_RELEASES_URL: ${{ env.VITE_CLIENT_RELEASES_URL }}
        run: npm run build

      - name: Tauri build
        working-directory: client
        run: npm run tauri build

      - name: Upload client artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            client/src-tauri/target/release/bundle/**/*
          if-no-files-found: error
          retention-days: 14
