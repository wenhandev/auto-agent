name: Release client

on:
  push:
    tags:
      - "client-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. client-v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  VITE_CLOUD_URL: https://rpa.wenhandev.com
  VITE_CLIENT_RELEASES_URL: https://github.com/wenhandev/auto-agent/releases

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            asset_glob: "*.dmg"
          - os: windows-latest
            platform: windows
            asset_glob: "*.msi"
          - os: ubuntu-latest
            platform: linux
            asset_glob: "*.AppImage"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#client-v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Build sidecar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\worker\build-exe.ps1
          python -m playwright install chromium

      - name: Build sidecar (macOS)
        if: runner.os == 'macOS'
        run: |
          ./worker/build-macos.sh
          python -m playwright install chromium

      - name: Build sidecar (Linux)
        if: runner.os == 'Linux'
        run: |
          ./worker/build-linux.sh
          python -m playwright install chromium

      - name: Stage sidecar for Tauri (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\worker\stage-client-sidecar.ps1

      - name: Stage sidecar for Tauri (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          chmod +x ./worker/stage-client-sidecar.sh
          ./worker/stage-client-sidecar.sh

      - name: Install client npm deps
        working-directory: client
        run: npm ci

      - name: Build client frontend
        working-directory: client
        env:
          VITE_CLOUD_URL: ${{ env.VITE_CLOUD_URL }}
          VITE_CLIENT_RELEASES_URL: ${{ env.VITE_CLIENT_RELEASES_URL }}
        run: npm run build

      - name: Tauri build
        working-directory: client
        run: npm run tauri build

      - name: Collect installer
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          BUNDLE="client/src-tauri/target/release/bundle"
          OUT="release-assets"
          mkdir -p "${OUT}"
          shopt -s globstar nullglob
          matches=("${BUNDLE}"/**/${{ matrix.asset_glob }})
          if [[ ${#matches[@]} -eq 0 ]]; then
            echo "No installer matching ${{ matrix.asset_glob }} under ${BUNDLE}" >&2
            find "${BUNDLE}" -type f || true
            exit 1
          fi
          src="${matches[0]}"
          ext="${src##*.}"
          dest="${OUT}/Auto-Agent-Client-${VERSION}-${{ matrix.platform }}.${ext}"
          cp "${src}" "${dest}"
          ls -la "${OUT}"

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#client-v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download all platform assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true

      - name: List assets
        run: find release-assets -type f -ls

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Auto Agent Client ${{ steps.meta.outputs.version }}
          draft: false
          prerelease: ${{ contains(steps.meta.outputs.version, '-') }}
          generate_release_notes: true
          files: release-assets/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
