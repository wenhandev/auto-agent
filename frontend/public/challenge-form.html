<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secure Registration Challenge</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a2332;
      --border: #2d3a4f;
      --text: #e8edf4;
      --muted: #8b9cb3;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #22c55e;
      --success-bg: rgba(34, 197, 94, 0.12);
      --danger: #ef4444;
      --track: #243044;
      --thumb: #60a5fa;
      --radius: 12px;
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(ellipse at top, #1e293b 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 32px;
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    .header p {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 1rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
    }

    .slider-section {
      margin: 24px 0;
      padding: 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .slider-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .slider-label span {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .badge {
      display: none;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--success);
      background: var(--success-bg);
      padding: 4px 10px;
      border-radius: 20px;
    }

    .badge.visible { display: inline-flex; }

    .badge svg { width: 14px; height: 14px; }

    #slider-track {
      position: relative;
      height: 44px;
      background: var(--track);
      border-radius: 22px;
      overflow: hidden;
      user-select: none;
      touch-action: none;
    }

    .slider-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #1d4ed8, var(--accent));
      border-radius: 22px;
      transition: width 0.05s;
      pointer-events: none;
    }

    .slider-hint {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      color: var(--muted);
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .slider-hint.hidden { opacity: 0; }

    #slider-thumb {
      position: absolute;
      left: 0;
      top: 4px;
      width: 36px;
      height: 36px;
      background: var(--thumb);
      border-radius: 50%;
      cursor: grab;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      z-index: 2;
      transition: box-shadow 0.2s;
    }

    #slider-thumb:active { cursor: grabbing; box-shadow: 0 4px 14px rgba(59, 130, 246, 0.5); }

    button[type="submit"] {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }

    button[type="submit"]:hover:not(:disabled) { background: var(--accent-hover); }

    button[type="submit"]:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    #success-panel {
      display: none;
      margin-top: 24px;
      padding: 20px;
      background: var(--success-bg);
      border: 1px solid rgba(34, 197, 94, 0.35);
      border-radius: 10px;
    }

    #success-panel.visible { display: block; }

    #success-panel h2 {
      color: var(--success);
      font-size: 1.1rem;
      margin-bottom: 12px;
    }

    #success-panel dl {
      display: grid;
      grid-template-columns: 100px 1fr;
      gap: 8px 12px;
      font-size: 0.9rem;
    }

    #success-panel dt { color: var(--muted); font-weight: 600; }
    #success-panel dd { color: var(--text); word-break: break-all; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>Secure Registration</h1>
      <p>Complete verification to submit your details</p>
    </div>

    <form id="challenge-form" novalidate>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="new-password" />
      </div>

      <div class="slider-section">
        <div class="slider-label">
          <span>Drag to verify</span>
          <span class="badge" id="verify-badge" role="status" aria-live="polite">
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>
            Verified
          </span>
        </div>
        <div id="slider-track" role="slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Slide to verify">
          <div class="slider-fill" id="slider-fill"></div>
          <span class="slider-hint" id="slider-hint">Slide handle to the end →</span>
          <div id="slider-thumb" tabindex="0" aria-label="Drag handle"></div>
        </div>
      </div>

      <div class="field">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="Jane Doe" required />
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="jane@example.com" required />
      </div>

      <div class="field">
        <label for="phone">Phone</label>
        <input type="tel" id="phone" name="phone" placeholder="+1 555 0100" required />
      </div>

      <button type="submit" id="submit-btn" disabled>Submit Registration</button>
    </form>

    <div id="success-panel" role="status" aria-live="polite">
      <h2>Registration Successful</h2>
      <dl id="success-values"></dl>
    </div>
  </div>

  <script>
    (function () {
      const track = document.getElementById("slider-track");
      const thumb = document.getElementById("slider-thumb");
      const fill = document.getElementById("slider-fill");
      const hint = document.getElementById("slider-hint");
      const badge = document.getElementById("verify-badge");
      const submitBtn = document.getElementById("submit-btn");
      const form = document.getElementById("challenge-form");
      const successPanel = document.getElementById("success-panel");
      const successValues = document.getElementById("success-values");

      let verified = false;
      let dragging = false;
      let startX = 0;
      let startLeft = 0;

      function maxLeft() {
        return track.clientWidth - thumb.offsetWidth;
      }

      function setPosition(px) {
        const max = maxLeft();
        const left = Math.max(0, Math.min(px, max));
        thumb.style.left = left + "px";
        const pct = max > 0 ? (left / max) * 100 : 0;
        fill.style.width = (left + thumb.offsetWidth / 2) + "px";
        track.setAttribute("aria-valuenow", Math.round(pct));

        if (pct >= 95 && !verified) {
          verified = true;
          badge.classList.add("visible");
          hint.classList.add("hidden");
          submitBtn.disabled = false;
          track.setAttribute("aria-valuenow", "100");
        } else if (pct < 95 && verified) {
          verified = false;
          badge.classList.remove("visible");
          hint.classList.remove("hidden");
          submitBtn.disabled = true;
        }
      }

      function maskPassword(value) {
        if (!value) return "(empty)";
        if (value.length <= 2) return "*".repeat(value.length);
        return value[0] + "*".repeat(value.length - 2) + value[value.length - 1];
      }

      function onPointerDown(e) {
        if (verified) return;
        dragging = true;
        thumb.setPointerCapture(e.pointerId);
        startX = e.clientX;
        startLeft = parseFloat(thumb.style.left) || 0;
        thumb.style.cursor = "grabbing";
      }

      function onPointerMove(e) {
        if (!dragging) return;
        const dx = e.clientX - startX;
        setPosition(startLeft + dx);
      }

      function onPointerUp(e) {
        if (!dragging) return;
        dragging = false;
        thumb.releasePointerCapture(e.pointerId);
        thumb.style.cursor = "grab";
        if (!verified) setPosition(0);
      }

      thumb.addEventListener("pointerdown", onPointerDown);
      thumb.addEventListener("pointermove", onPointerMove);
      thumb.addEventListener("pointerup", onPointerUp);
      thumb.addEventListener("pointercancel", onPointerUp);

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        if (!verified) return;

        const password = document.getElementById("password").value;
        const name = document.getElementById("name").value;
        const email = document.getElementById("email").value;
        const phone = document.getElementById("phone").value;

        successValues.innerHTML = [
          ["Password", maskPassword(password)],
          ["Name", name || "(empty)"],
          ["Email", email || "(empty)"],
          ["Phone", phone || "(empty)"],
        ].map(function (row) {
          return "<dt>" + row[0] + "</dt><dd>" + row[1] + "</dd>";
        }).join("");

        form.style.display = "none";
        successPanel.classList.add("visible");
      });

      setPosition(0);
    })();
  </script>
</body>
</html>
