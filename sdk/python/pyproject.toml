[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-agent-sdk"
version = "0.1.0"
description = "Python client for the auto-agent /api/v1 public API."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
auto-agent = "auto_agent_sdk.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["."]
include = ["auto_agent_sdk*"]
