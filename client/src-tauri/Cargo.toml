[package]
name = "auto-agent-client"
version = "0.1.0"
description = "Auto Agent client shell"
authors = ["Auto Agent"]
edition = "2021"

[lib]
name = "auto_agent_client_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
