[package]
name = "auto-agent-client"
version = "0.1.0"
description = "Auto Agent client shell"
authors = ["Auto Agent"]
edition = "2021"

[lib]
name = "auto_agent_client_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-http = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "tokio"] }
hyperlocal = "0.9"
http-body-util = "0.1"
tokio = { version = "1", features = ["net", "sync", "macros", "rt-multi-thread", "io-util"] }
tokio-tungstenite = "0.26"
tokio-util = "0.7"
futures-util = "0.3"
http = "1"
urlencoding = "2"
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
