<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>滑动拼图验证 — Secure Registration</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --border: #e4e7ed;
      --text: #303133;
      --muted: #909399;
      --accent: #409eff;
      --accent-hover: #66b1ff;
      --success: #67c23a;
      --success-bg: rgba(103, 194, 58, 0.12);
      --danger: #f56c6c;
      --track: #f0f2f5;
      --thumb: #409eff;
      --radius: 8px;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 380px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 28px 24px 24px;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .header p {
      color: var(--muted);
      font-size: 0.85rem;
    }

    .captcha-section {
      margin-bottom: 20px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      background: #fafafa;
    }

    .captcha-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: #fff;
      border-bottom: 1px solid var(--border);
      font-size: 0.85rem;
      color: var(--muted);
    }

    .captcha-header strong {
      color: var(--text);
      font-weight: 600;
    }

    .refresh-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: #fff;
      color: var(--muted);
      font-size: 0.78rem;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }

    .refresh-btn:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    .refresh-btn svg { width: 14px; height: 14px; }

    .canvas-wrap {
      position: relative;
      width: 100%;
      height: 160px;
      background: #dde3ea;
      overflow: hidden;
    }

    #bg-canvas {
      display: block;
      width: 100%;
      height: 160px;
    }

    #piece-canvas {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
      filter: drop-shadow(2px 2px 4px rgba(0, 0, 0, 0.35));
    }

    .captcha-fail {
      display: none;
      padding: 8px 12px;
      font-size: 0.78rem;
      color: var(--danger);
      background: rgba(245, 108, 108, 0.08);
      border-top: 1px solid rgba(245, 108, 108, 0.2);
    }

    .captcha-fail.visible { display: block; }

    .track-wrap {
      position: relative;
      height: 42px;
      background: var(--track);
      border-top: 1px solid var(--border);
      user-select: none;
      touch-action: none;
    }

    .track-hint {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.82rem;
      color: var(--muted);
      pointer-events: none;
      transition: opacity 0.2s;
      padding-left: 36px;
    }

    .track-hint.hidden { opacity: 0; }

    #captcha-track {
      position: absolute;
      inset: 0;
    }

    #slider-thumb {
      position: absolute;
      left: 0;
      top: 3px;
      width: 36px;
      height: 36px;
      background: var(--thumb);
      border-radius: 4px;
      cursor: grab;
      box-shadow: 0 2px 6px rgba(64, 158, 255, 0.45);
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #slider-thumb::after {
      content: "››";
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -3px;
    }

    #slider-thumb:active { cursor: grabbing; }

    .badge {
      display: none;
      align-items: center;
      gap: 5px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--success);
      background: var(--success-bg);
      padding: 4px 10px;
      border-radius: 20px;
    }

    .badge.visible { display: inline-flex; }

    .badge svg { width: 14px; height: 14px; }

    .field { margin-bottom: 16px; }

    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.95rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(64, 158, 255, 0.2);
    }

    button[type="submit"] {
      width: 100%;
      padding: 12px;
      margin-top: 4px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }

    button[type="submit"]:hover:not(:disabled) { background: var(--accent-hover); }

    button[type="submit"]:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    #success-panel {
      display: none;
      margin-top: 20px;
      padding: 16px;
      background: var(--success-bg);
      border: 1px solid rgba(103, 194, 58, 0.35);
      border-radius: var(--radius);
    }

    #success-panel.visible { display: block; }

    #success-panel h2 {
      color: var(--success);
      font-size: 1rem;
      margin-bottom: 10px;
    }

    #success-panel dl {
      display: grid;
      grid-template-columns: 80px 1fr;
      gap: 6px 10px;
      font-size: 0.85rem;
    }

    #success-panel dt { color: var(--muted); font-weight: 600; }
    #success-panel dd { color: var(--text); word-break: break-all; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>Secure Registration</h1>
      <p>Complete puzzle verification to continue</p>
    </div>

    <div class="captcha-section" id="captcha-section">
      <div class="captcha-header">
        <span><strong>滑动拼图验证</strong></span>
        <span class="badge" id="verify-badge" role="status" aria-live="polite">
          <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>
          验证成功
        </span>
        <button type="button" class="refresh-btn" id="refresh-btn" aria-label="刷新验证码">
          <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd"/></svg>
          刷新
        </button>
      </div>
      <div class="canvas-wrap">
        <canvas id="bg-canvas" width="340" height="160"></canvas>
        <canvas id="piece-canvas" width="340" height="160"></canvas>
      </div>
      <div class="captcha-fail" id="captcha-fail" role="alert"></div>
      <div class="track-wrap">
        <div id="captcha-track"></div>
        <span class="track-hint" id="track-hint">请拖动滑块完成拼图</span>
        <div id="slider-thumb" tabindex="0" role="slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="拖动滑块"></div>
      </div>
    </div>

    <form id="challenge-form" novalidate>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="new-password" />
      </div>

      <div class="field">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="Jane Doe" required />
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="jane@example.com" required />
      </div>

      <div class="field">
        <label for="phone">Phone</label>
        <input type="tel" id="phone" name="phone" placeholder="+1 555 0100" required />
      </div>

      <button type="submit" id="submit-btn" disabled>Submit Registration</button>
    </form>

    <div id="success-panel" role="status" aria-live="polite">
      <h2>Registration Successful</h2>
      <dl id="success-values"></dl>
    </div>
  </div>

  <script>
    (function () {
      const CW = 340;
      const CH = 160;
      const PIECE_W = 52;
      const PIECE_H = 52;
      const PIECE_START = 8;
      const ALIGN_TOLERANCE = 0.05;

      const bgCanvas = document.getElementById("bg-canvas");
      const pieceCanvas = document.getElementById("piece-canvas");
      const bgCtx = bgCanvas.getContext("2d");
      const pieceCtx = pieceCanvas.getContext("2d");
      const trackWrap = document.querySelector(".track-wrap");
      const track = document.getElementById("captcha-track");
      const thumb = document.getElementById("slider-thumb");
      const hint = document.getElementById("track-hint");
      const badge = document.getElementById("verify-badge");
      const failEl = document.getElementById("captcha-fail");
      const refreshBtn = document.getElementById("refresh-btn");
      const submitBtn = document.getElementById("submit-btn");
      const form = document.getElementById("challenge-form");
      const successPanel = document.getElementById("success-panel");
      const successValues = document.getElementById("success-values");

      let verified = false;
      let dragging = false;
      let startX = 0;
      let startLeft = 0;
      let gapX = 0;
      let pieceY = 0;
      let dragTrack = [];
      let bgImageData = null;

      function puzzlePath(ctx, x, y, w, h) {
        const r = 8;
        const tabR = 10;
        const tabCx = x + w * 0.5;
        const tabCy = y + h * 0.5;
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h * 0.35);
        ctx.arc(tabCx, tabCy, tabR, -Math.PI / 2, Math.PI / 2, false);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
      }

      function rand(min, max) {
        return min + Math.random() * (max - min);
      }

      function drawBackground() {
        const g = bgCtx.createLinearGradient(0, 0, CW, CH);
        const hues = [
          [rand(200, 260), rand(55, 75)],
          [rand(10, 40), rand(50, 70)],
          [rand(120, 160), rand(45, 65)],
        ];
        const pick = hues[Math.floor(Math.random() * hues.length)];
        g.addColorStop(0, "hsl(" + pick[0] + "," + pick[1] + "%,62%)");
        g.addColorStop(0.5, "hsl(" + (pick[0] + 30) + "," + (pick[1] - 10) + "%,48%)");
        g.addColorStop(1, "hsl(" + (pick[0] + 60) + "," + pick[1] + "%,55%)");
        bgCtx.fillStyle = g;
        bgCtx.fillRect(0, 0, CW, CH);

        for (let i = 0; i < 18; i++) {
          bgCtx.fillStyle = "rgba(255,255,255," + rand(0.05, 0.18) + ")";
          bgCtx.beginPath();
          bgCtx.arc(rand(0, CW), rand(0, CH), rand(8, 36), 0, Math.PI * 2);
          bgCtx.fill();
        }

        bgCtx.strokeStyle = "rgba(0,0,0,0.06)";
        for (let i = 0; i < 6; i++) {
          bgCtx.beginPath();
          bgCtx.moveTo(rand(0, CW), rand(0, CH));
          bgCtx.lineTo(rand(0, CW), rand(0, CH));
          bgCtx.stroke();
        }

        bgImageData = bgCtx.getImageData(0, 0, CW, CH);
      }

      function cutPuzzle() {
        gapX = Math.floor(rand(PIECE_W + 40, CW - PIECE_W - 40));
        pieceY = Math.floor(rand(20, CH - PIECE_H - 20));

        bgCtx.putImageData(bgImageData, 0, 0);

        puzzlePath(bgCtx, gapX, pieceY, PIECE_W, PIECE_H);
        bgCtx.save();
        bgCtx.clip();
        bgCtx.clearRect(gapX - 2, pieceY - 2, PIECE_W + 4, PIECE_H + 4);
        bgCtx.restore();

        puzzlePath(bgCtx, gapX, pieceY, PIECE_W, PIECE_H);
        bgCtx.strokeStyle = "rgba(0,0,0,0.45)";
        bgCtx.lineWidth = 1.5;
        bgCtx.stroke();
        bgCtx.strokeStyle = "rgba(255,255,255,0.35)";
        bgCtx.lineWidth = 1;
        bgCtx.stroke();

        pieceCtx.clearRect(0, 0, CW, CH);
        puzzlePath(pieceCtx, PIECE_START, pieceY, PIECE_W, PIECE_H);
        pieceCtx.save();
        pieceCtx.clip();
        pieceCtx.drawImage(bgCanvas, gapX, pieceY, PIECE_W, PIECE_H, PIECE_START, pieceY, PIECE_W, PIECE_H);
        pieceCtx.restore();
        puzzlePath(pieceCtx, PIECE_START, pieceY, PIECE_W, PIECE_H);
        pieceCtx.strokeStyle = "rgba(255,255,255,0.6)";
        pieceCtx.lineWidth = 1.5;
        pieceCtx.stroke();
      }

      function maxThumbLeft() {
        return trackWrap.clientWidth - thumb.offsetWidth;
      }

      function pieceXFromThumb(left) {
        const max = maxThumbLeft();
        const travel = CW - PIECE_W - PIECE_START;
        const ratio = max > 0 ? left / max : 0;
        return PIECE_START + ratio * travel;
      }

      function thumbLeftFromPieceX(px) {
        const travel = CW - PIECE_W - PIECE_START;
        const ratio = travel > 0 ? (px - PIECE_START) / travel : 0;
        return Math.max(0, Math.min(maxThumbLeft(), ratio * maxThumbLeft()));
      }

      function updatePiecePosition(px) {
        pieceCtx.clearRect(0, 0, CW, CH);
        puzzlePath(pieceCtx, px, pieceY, PIECE_W, PIECE_H);
        pieceCtx.save();
        pieceCtx.clip();
        pieceCtx.drawImage(bgCanvas, gapX, pieceY, PIECE_W, PIECE_H, px, pieceY, PIECE_W, PIECE_H);
        pieceCtx.restore();
        puzzlePath(pieceCtx, px, pieceY, PIECE_W, PIECE_H);
        pieceCtx.strokeStyle = "rgba(255,255,255,0.6)";
        pieceCtx.lineWidth = 1.5;
        pieceCtx.stroke();
      }

      function setThumbLeft(left) {
        const max = maxThumbLeft();
        const clamped = Math.max(0, Math.min(left, max));
        thumb.style.left = clamped + "px";
        const pct = max > 0 ? (clamped / max) * 100 : 0;
        thumb.setAttribute("aria-valuenow", Math.round(pct));
        updatePiecePosition(pieceXFromThumb(clamped));
      }

      function resetThumb() {
        setThumbLeft(0);
        dragTrack = [];
      }

      function showFail(reason) {
        failEl.textContent = reason;
        failEl.classList.add("visible");
        setTimeout(function () {
          failEl.classList.remove("visible");
        }, 2800);
      }

      function analyzeDragTrack(track) {
        if (track.length < 4) {
          return { ok: false, reason: "轨迹点过少", signal: "too_few_points" };
        }
        const duration = track[track.length - 1].t - track[0].t;
        if (duration < 300) {
          return { ok: false, reason: "拖动过快，请重试", signal: "too_fast" };
        }

        const velocities = [];
        for (let i = 1; i < track.length; i++) {
          const dt = track[i].t - track[i - 1].t;
          if (dt <= 0) continue;
          const dx = track[i].x - track[i - 1].x;
          velocities.push(dx / dt);
        }
        if (velocities.length < 3) {
          return { ok: false, reason: "轨迹异常", signal: "too_few_velocities" };
        }

        const mean = velocities.reduce(function (a, b) { return a + b; }, 0) / velocities.length;
        const variance = velocities.reduce(function (a, v) { return a + (v - mean) * (v - mean); }, 0) / velocities.length;
        if (variance < 0.0008 && Math.abs(mean) > 0.05) {
          return { ok: false, reason: "拖动过于机械，请自然滑动", signal: "too_linear" };
        }

        const ys = track.map(function (p) { return p.y; });
        const yMin = Math.min.apply(null, ys);
        const yMax = Math.max.apply(null, ys);
        const yRange = yMax - yMin;
        const yDeltas = [];
        for (let i = 1; i < ys.length; i++) {
          yDeltas.push(ys[i] - ys[i - 1]);
        }
        const yMean = yDeltas.reduce(function (a, b) { return a + b; }, 0) / Math.max(1, yDeltas.length);
        const yVar = yDeltas.reduce(function (a, d) { return a + (d - yMean) * (d - yMean); }, 0) / Math.max(1, yDeltas.length);

        if (yRange < 0.8 && yVar < 0.002) {
          return { ok: false, reason: "检测到非人类轨迹", signal: "no_jitter" };
        }

        return { ok: true };
      }

      function checkAlignment(px) {
        const err = Math.abs(px - gapX);
        const maxErr = PIECE_W * ALIGN_TOLERANCE + 2;
        return err <= maxErr;
      }

      function passCaptcha() {
        verified = true;
        badge.classList.add("visible");
        hint.classList.add("hidden");
        submitBtn.disabled = false;
        thumb.style.cursor = "default";
        failEl.classList.remove("visible");
      }

      function failCaptcha(reason, signal) {
        verified = false;
        badge.classList.remove("visible");
        hint.classList.remove("hidden");
        submitBtn.disabled = true;
        showFail(reason);
        resetThumb();
        cutPuzzle();
        failEl.dataset.signal = signal || "";
      }

      function newPuzzle() {
        verified = false;
        badge.classList.remove("visible");
        hint.classList.remove("hidden");
        submitBtn.disabled = true;
        failEl.classList.remove("visible");
        failEl.dataset.signal = "";
        dragTrack = [];
        drawBackground();
        cutPuzzle();
        resetThumb();
      }

      function onPointerDown(e) {
        if (verified) return;
        dragging = true;
        dragTrack = [{ t: Date.now(), x: e.clientX, y: e.clientY }];
        thumb.setPointerCapture(e.pointerId);
        startX = e.clientX;
        startLeft = parseFloat(thumb.style.left) || 0;
        thumb.style.cursor = "grabbing";
      }

      function onPointerMove(e) {
        if (!dragging) return;
        dragTrack.push({ t: Date.now(), x: e.clientX, y: e.clientY });
        const dx = e.clientX - startX;
        setThumbLeft(startLeft + dx);
      }

      function onPointerUp(e) {
        if (!dragging) return;
        dragging = false;
        dragTrack.push({ t: Date.now(), x: e.clientX, y: e.clientY });
        thumb.releasePointerCapture(e.pointerId);
        thumb.style.cursor = "grab";

        if (verified) return;

        const px = pieceXFromThumb(parseFloat(thumb.style.left) || 0);
        const botCheck = analyzeDragTrack(dragTrack);
        if (!botCheck.ok) {
          failCaptcha(botCheck.reason, botCheck.signal);
          return;
        }
        if (!checkAlignment(px)) {
          failCaptcha("拼图未对齐，请重试", "misaligned");
          return;
        }
        passCaptcha();
      }

      function maskPassword(value) {
        if (!value) return "(empty)";
        if (value.length <= 2) return "*".repeat(value.length);
        return value[0] + "*".repeat(value.length - 2) + value[value.length - 1];
      }

      thumb.addEventListener("pointerdown", onPointerDown);
      thumb.addEventListener("pointermove", onPointerMove);
      thumb.addEventListener("pointerup", onPointerUp);
      thumb.addEventListener("pointercancel", onPointerUp);
      refreshBtn.addEventListener("click", newPuzzle);

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        if (!verified) return;

        const password = document.getElementById("password").value;
        const name = document.getElementById("name").value;
        const email = document.getElementById("email").value;
        const phone = document.getElementById("phone").value;

        successValues.innerHTML = [
          ["Password", maskPassword(password)],
          ["Name", name || "(empty)"],
          ["Email", email || "(empty)"],
          ["Phone", phone || "(empty)"],
        ].map(function (row) {
          return "<dt>" + row[0] + "</dt><dd>" + row[1] + "</dd>";
        }).join("");

        form.style.display = "none";
        document.getElementById("captcha-section").style.display = "none";
        successPanel.classList.add("visible");
      });

      newPuzzle();
    })();
  </script>
</body>
</html>
