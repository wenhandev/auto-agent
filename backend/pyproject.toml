[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-agent-backend"
version = "0.1.0"
description = "Auto-agent backend POC: planner + fuzzy ADK agents + Playwright executor."
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "playwright>=1.42",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "google-adk>=1.28",
    "litellm>=1.40",
    "sqlmodel>=0.0.16",
    "cryptography>=42.0",
    "bcrypt>=4.1",
    "python-multipart>=0.0.9",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "websockets>=12.0",
]

[project.optional-dependencies]
worker-build = [
    "pyinstaller>=6.6",
]
desktop-macos = [
    "pyobjc-framework-Cocoa>=10.0",
    "pyobjc-framework-Quartz>=10.0",
    "pyobjc-framework-ApplicationServices>=10.0",
]
desktop-windows = [
    "pywinauto>=0.6.8",
    "Pillow>=10.0",
    "pywin32>=306; platform_system=='Windows'",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[project.scripts]
auto-agent-worker = "app.worker.cli:main"
