services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////app/data/auto_agent.db
      FRONTEND_STATIC_DIR: /srv/frontend
    volumes:
      - app_data:/app/data
    restart: unless-stopped
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-rpa.wenhandev.com}
      ACME_EMAIL: ${ACME_EMAIL:-admin@wenhandev.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  app_data:
  caddy_data:
  caddy_config:
